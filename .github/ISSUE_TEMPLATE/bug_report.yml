name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Integration version
      description: From the integration's entry under Settings → Devices & services, or the Marketplace.
      placeholder: e.g. 0.5.0
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      description: From Settings → About.
      placeholder: e.g. 2026.11.1
    validations:
      required: true
  - type: input
    id: button
    attributes:
      label: Button model
      description: The model shown on the device page, and whether it is paired with or without a passkey.
      placeholder: e.g. SBBT-102C, paired without a passkey
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Log lines of bluetooth_button_plus, with debug logging if you can. They can contain Bluetooth addresses; replace them before posting if you prefer.
      render: text
