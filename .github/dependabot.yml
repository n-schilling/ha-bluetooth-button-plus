version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    ignore:
      # Pinned to what the Home Assistant release of the test harness pins;
      # they move with pytest-homeassistant, not on their own
      - dependency-name: bleak
      - dependency-name: dbus-fast
      - dependency-name: aiousbwatcher
      - dependency-name: serialx
      - dependency-name: aiohasupervisor
