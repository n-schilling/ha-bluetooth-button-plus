# Integration quality scale, checked against the rules of Home Assistant 2026.11.
# hassfest only validates this file for core integrations; it documents the
# state of this custom integration rule by rule, and tests/test_quality_scale.py
# fails while a rule is missing or not done.
rules:
  # Bronze
  action-setup:
    status: done
    comment: The action buzz is registered in async_setup.
  appropriate-polling:
    status: exempt
    comment: Nothing is polled; availability follows the button's advertisements.
  brands:
    status: done
    comment: Brand images ship in brand/.
  common-modules:
    status: done
    comment: Base entities in entity.py, the Bluetooth connection in device.py.
  config-flow:
    status: done
    comment: Bluetooth discovery and a manual step that lists the buttons in range.
  config-flow-test-coverage: done
  dependency-transparency:
    status: exempt
    comment: No requirements; bleak and bleak-retry-connector come with Home Assistant.
  docs-actions: done
  docs-conditions:
    status: exempt
    comment: No conditions of its own.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup:
    status: done
    comment: The coordinator entities subscribe in async_added_to_hass.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure:
    status: done
    comment: The flow connects once, checks the buzzer and reads the volume, which needs the bond.
  test-before-setup:
    status: exempt
    comment: >-
      A battery device that is often away: the setup does not wait for it,
      its buttons are unavailable until the host's adapter sees it. A
      missing bond shows on the first press with a message of its own.
  unique-config-entry:
    status: done
    comment: The Bluetooth address is the unique ID.

  # Silver
  action-exceptions:
    status: done
    comment: A press or the action that fails raises a translated HomeAssistantError.
  config-entry-unloading:
    status: done
    comment: The unload cancels a timed stop and waits for a command in progress.
  docs-configuration-parameters:
    status: exempt
    comment: No options flow; volume and duration are configuration entities, described in the README.
  docs-installation-parameters:
    status: done
    comment: The flow asks for the button only (README, Installation).
  entity-unavailable:
    status: done
    comment: The buttons are unavailable while the host's adapter does not see the button.
  integration-owner: done
  log-when-unavailable:
    status: done
    comment: Leaving and coming back into range of the host's adapter are logged once each.
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: No credentials; the bond lives in BlueZ on the host.
  test-coverage:
    status: done
    comment: CI fails below 99 %.

  # Gold
  devices:
    status: done
    comment: One device per button.
  diagnostics:
    status: done
    comment: Without the address, the title or scanner names; scanners by kind and signal only.
  discovery:
    status: done
    comment: Bluetooth discovery by the local name SBBT-*.
  discovery-update-info:
    status: exempt
    comment: The Bluetooth address does not change.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-triggers:
    status: exempt
    comment: No triggers of its own; the presses come from BTHome.
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: One config entry per button; each new button is discovered and added on its own.
  entity-category:
    status: done
    comment: Volume and duration are configuration entities.
  entity-device-class:
    status: done
    comment: Buzz is an identify button, the duration a duration.
  entity-disabled-by-default:
    status: exempt
    comment: Five entities, each a function of its own; none is noisy or rarely needed.
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow:
    status: exempt
    comment: The entry holds only the button's address; volume and duration are entities.
  repair-issues:
    status: exempt
    comment: >-
      Nothing to repair from Home Assistant: out of range is availability, a
      missing bond is a pairing on the host, reported where it fails.
  stale-devices:
    status: exempt
    comment: One device per config entry; deleting the entry removes it.

  # Platinum
  async-dependency:
    status: done
    comment: bleak and bleak-retry-connector are asyncio libraries.
  inject-websession:
    status: exempt
    comment: No HTTP client.
  strict-typing:
    status: done
    comment: mypy --strict runs in CI (mypy.ini).
